<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GKIN Amstelveen – Mededelingen Bewerken</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { gkin: { green: '#3A7C22', dark: '#2d6119' } } } }
        }
    </script>
    <style>
        html { overflow-y: scroll; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .spinner { animation: spin 1s linear infinite; }
    </style>
    <script src="/static/i18n.js"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    <header class="bg-gkin-green shadow-md">
        <div class="max-w-4xl mx-auto px-6 py-5 flex items-center gap-4">
            <a href="/mededelingen"><img src="/static/logo2.png" alt="GKIN Logo" class="h-12 w-12 object-contain shrink-0"></a>
            <div class="flex-1">
                <h1 class="text-white text-2xl font-bold tracking-tight">GKIN Amstelveen</h1>
                <p class="text-green-100 text-sm mt-0.5">Mededelingen bewerken</p>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-6 py-8">
        <a href="/mededelingen" class="inline-flex items-center gap-1 text-sm text-gkin-green hover:text-gkin-dark mb-5">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
            <span>Terug</span>
        </a>

        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 mb-5">
            <h2 class="text-base font-semibold text-gkin-green mb-4 flex items-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                <span>Datum</span>
            </h2>
            <select id="date" class="w-full rounded-lg border border-gray-300 px-4 py-2.5 text-sm bg-white shadow-sm focus:outline-none focus:ring-2 focus:ring-gkin-green">
                <option value="" disabled selected>— Kies een datum —</option>
                {% for d in dates %}
                <option value="{{ d.value }}">{{ d.label }}</option>
                {% endfor %}
            </select>
        </div>

        <div id="editor" class="hidden">
            <form id="textForm" class="space-y-5">
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                    <h2 class="text-base font-semibold text-gkin-green mb-4">Regionale mededelingen</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Nederlands</label>
                            <textarea name="regionale_nl" id="regionale_nl" rows="6" class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-gkin-green resize-y"></textarea>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Bahasa Indonesia</label>
                            <textarea name="regionale_id" id="regionale_id" rows="6" class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-gkin-green resize-y"></textarea>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                    <h2 class="text-base font-semibold text-gkin-green mb-4">Landelijke mededelingen</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Nederlands</label>
                            <textarea name="landelijke_nl" id="landelijke_nl" rows="6" class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-gkin-green resize-y"></textarea>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Bahasa Indonesia</label>
                            <textarea name="landelijke_id" id="landelijke_id" rows="6" class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-gkin-green resize-y"></textarea>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                    <h2 class="text-base font-semibold text-gkin-green mb-4">Afbeelding / bijlage</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Upload afbeelding</label>
                            <label class="flex items-center gap-2 w-full rounded-lg border border-dashed border-gray-300 px-3 py-2 bg-white cursor-pointer hover:border-gkin-green transition-colors">
                                <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                                <span id="imgLabel" class="text-sm text-gray-500">Kies afbeelding...</span>
                                <input type="file" id="imgUpload" name="image" accept="image/*" class="hidden" onchange="updateImgLabel(this)">
                            </label>
                            <button type="button" id="uploadImgBtn" class="mt-2 text-xs bg-blue-50 hover:bg-blue-100 text-blue-700 border border-blue-200 rounded-lg px-3 py-1.5 flex items-center gap-1 transition-colors disabled:opacity-50">
                                <span>Upload afbeelding</span>
                            </button>
                            <div id="imgStatus" class="hidden mt-2 text-xs rounded-lg p-2 border"></div>
                        </div>
                        <div>
                            <p class="text-sm font-medium text-gray-700 mb-1">Huidige afbeelding</p>
                            <div id="imgPreviewBox" class="hidden rounded-lg border border-gray-200 bg-white p-2">
                                <img id="imgPreview" src="" alt="" class="max-h-40 object-contain rounded border border-gray-100">
                                <p id="imgName" class="text-xs text-gray-500 mt-1 truncate"></p>
                                <button type="button" id="delImgBtn" class="mt-2 text-xs bg-red-50 hover:bg-red-100 text-red-700 border border-red-200 rounded-lg px-3 py-1">Verwijder</button>
                            </div>
                            <p id="noImg" class="text-sm text-gray-400 italic">Geen afbeelding gekoppeld</p>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                    <div class="flex gap-3">
                        <button type="button" id="saveBtn" class="flex-1 bg-gkin-green hover:bg-gkin-dark text-white font-semibold py-3 rounded-lg shadow-md transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                            Bewaren in Excel
                        </button>
                    </div>
                    <div id="saveStatus" class="hidden mt-3 text-xs rounded-lg p-2 border"></div>
                </div>
            </form>
        </div>
    </main>

    <script>
        const dateSelect = document.getElementById('date');
        const editor = document.getElementById('editor');
        const saveBtn = document.getElementById('saveBtn');
        const saveStatus = document.getElementById('saveStatus');
        const imgUpload = document.getElementById('imgUpload');
        const imgLabel = document.getElementById('imgLabel');
        const uploadImgBtn = document.getElementById('uploadImgBtn');
        const imgStatus = document.getElementById('imgStatus');
        const imgPreviewBox = document.getElementById('imgPreviewBox');
        const noImg = document.getElementById('noImg');
        const imgPreview = document.getElementById('imgPreview');
        const imgName = document.getElementById('imgName');
        const delImgBtn = document.getElementById('delImgBtn');

        let currentImage = null;

        function updateImgLabel(input) {
            imgLabel.textContent = input.files[0]?.name || 'Kies afbeelding...';
        }

        function showStatus(el, msg, isError) {
            el.textContent = msg;
            el.className = `mt-2 text-xs rounded-lg p-2 border ${isError ? 'bg-red-50 text-red-700 border-red-200' : 'bg-green-50 text-green-700 border-green-200'}`;
            el.classList.remove('hidden');
            setTimeout(() => el.classList.add('hidden'), 5000);
        }

        async function loadData() {
            const date = dateSelect.value;
            if (!date) { editor.classList.add('hidden'); return; }

            const resp = await fetch(`/mededelingen-editor-data?date=${encodeURIComponent(date)}`);
            const data = await resp.json();
            if (data.error) { alert(data.error); return; }

            document.getElementById('regionale_nl').value = data.regionale_nl || '';
            document.getElementById('regionale_id').value = data.regionale_id || '';
            document.getElementById('landelijke_nl').value = data.landelijke_nl || '';
            document.getElementById('landelijke_id').value = data.landelijke_id || '';

            currentImage = data.image || null;
            updateImagePreview();
            editor.classList.remove('hidden');
        }

        function updateImagePreview() {
            if (currentImage && currentImage.url) {
                imgPreviewBox.classList.remove('hidden');
                noImg.classList.add('hidden');
                imgPreview.src = currentImage.url;
                imgName.textContent = currentImage.name || '';
            } else {
                imgPreviewBox.classList.add('hidden');
                noImg.classList.remove('hidden');
                imgPreview.src = '';
            }
        }

        dateSelect.addEventListener('change', loadData);

        saveBtn.addEventListener('click', async () => {
            saveBtn.disabled = true;
            saveBtn.textContent = 'Bezig...';
            const date = dateSelect.value;
            try {
                const resp = await fetch('/mededelingen-editor-save', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        date: date,
                        regionale_nl: document.getElementById('regionale_nl').value,
                        regionale_id: document.getElementById('regionale_id').value,
                        landelijke_nl: document.getElementById('landelijke_nl').value,
                        landelijke_id: document.getElementById('landelijke_id').value,
                    })
                });
                const data = await resp.json();
                if (data.error) throw new Error(data.error);
                showStatus(saveStatus, 'Opgeslagen in Excel', false);
            } catch (e) {
                showStatus(saveStatus, 'Fout: ' + e.message, true);
            } finally {
                saveBtn.disabled = false;
                saveBtn.textContent = 'Bewaren in Excel';
            }
        });

        uploadImgBtn.addEventListener('click', async () => {
            const file = imgUpload.files[0];
            if (!file) { showStatus(imgStatus, 'Kies eerst een afbeelding', true); return; }
            const date = dateSelect.value;
            if (!date) { showStatus(imgStatus, 'Selecteer eerst een datum', true); return; }

            uploadImgBtn.disabled = true;
            const form = new FormData();
            form.append('image', file);
            form.append('date', date);

            try {
                const resp = await fetch('/mededelingen-upload-image', {method: 'POST', body: form});
                const data = await resp.json();
                if (data.error) throw new Error(data.error);
                currentImage = {url: data.url, name: data.name};
                updateImagePreview();
                showStatus(imgStatus, 'Afbeelding geüpload', false);
                imgUpload.value = '';
                imgLabel.textContent = 'Kies afbeelding...';
            } catch (e) {
                showStatus(imgStatus, 'Fout: ' + e.message, true);
            } finally {
                uploadImgBtn.disabled = false;
            }
        });

        delImgBtn.addEventListener('click', async () => {
            if (!currentImage) return;
            if (!confirm('Afbeelding verwijderen?')) return;
            const date = dateSelect.value;
            try {
                const resp = await fetch('/mededelingen-delete-image', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({date: date})
                });
                const data = await resp.json();
                if (data.error) throw new Error(data.error);
                currentImage = null;
                updateImagePreview();
                showStatus(imgStatus, 'Afbeelding verwijderd', false);
            } catch (e) {
                showStatus(imgStatus, 'Fout: ' + e.message, true);
            }
        });
    </script>
</body>
</html>
