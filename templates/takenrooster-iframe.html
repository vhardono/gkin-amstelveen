<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GKIN Amstelveen – Takenrooster</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { gkin: { green: '#3A7C22', dark: '#2d6119' } } } }
        }
    </script>
    <style>
        body { padding: 0.5rem; font-size: 0.875rem; }
        select, input { padding: 0.25rem 0.5rem; font-size: 0.875rem; }
        button { padding: 0.375rem 0.75rem; font-size: 0.875rem; }
    </style>
    <script src="/static/i18n.js"></script>
</head>
<body class="bg-gray-50">
    <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-4">
        <div class="mb-3">
            <h2 class="text-sm font-semibold text-gray-800 text-left" data-i18n="home.schedule.title">Takenrooster</h2>
        </div>
        <div class="flex items-center gap-1.5">
            <select id="scheduleDate" class="flex-1 min-w-0 rounded-md border border-gray-200 px-2 py-2 text-sm bg-gray-50 focus:outline-none focus:ring-2 focus:ring-gkin-green/30 focus:border-gkin-green">
                <option value="" data-i18n="home.schedule.select">-- Kies een datum --</option>
            </select>
            <a href="/rooster/persoon?embed=1" data-i18n-title="rooster.my_duties" title="Mijn diensten"
               class="shrink-0 inline-flex items-center text-gkin-green border border-gkin-green rounded-lg p-2 hover:bg-green-50 transition">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
            </a>
            <a href="/rooster?edit=1&embed=1"
               class="shrink-0 inline-flex items-center text-xs font-semibold text-white bg-gkin-green rounded-lg px-3 py-2 hover:bg-gkin-dark transition">
                <span data-i18n="rooster.edit_bijbel">Bewerk</span>
            </a>
        </div>
        <div id="scheduleDetail" class="hidden mt-3 rounded-md bg-gray-50 border border-gray-100 p-3 text-sm">
            <!-- Filled by JS -->
        </div>
        <div id="emptyState" class="mt-3 text-center text-xs text-gray-400 py-4" data-i18n="tr.empty">
            Selecteer een datum om de details te bekijken
        </div>
    </div>

    <script>
        // Auto-resize iframe to fit content
        function resizeIframe() {
            const height = document.body.scrollHeight;
            window.parent.postMessage({ type: 'resize', height: height }, '*');
        }

        // Send initial height
        window.addEventListener('load', resizeIframe);
        window.addEventListener('resize', resizeIframe);
        const dateData = {{ dates | tojson }};
        const scheduleDate = document.getElementById('scheduleDate');
        const scheduleDetail = document.getElementById('scheduleDetail');

        // Service type from opmerking (same rules as main site)
        function _dienstShort(opm) {
            return (opm || '').split(/\s*[:]\s*/)[0].replace(/https?:\/\/\S+/gi, '').trim();
        }

        // Populate date dropdown (data-* attrs let i18n.js localize the labels)
        dateData.forEach(d => {
            const opt = document.createElement('option');
            opt.value = d.value;
            const dienst = _dienstShort(d.opmerking);
            opt.textContent = dienst ? `${d.label} — ${dienst}` : d.label;
            opt.dataset.dayIdx = d.day_idx;
            opt.dataset.monthIdx = d.month_idx;
            opt.dataset.dayNum = d.day_num;
            opt.dataset.year = d.year;
            opt.dataset.dienst = dienst;
            scheduleDate.appendChild(opt);
        });

        // Duty fields: [row key, i18n key, Dutch fallback]
        const FIELDS = [
            ['predikant',   'tr.predikant',   'Predikant'],
            ['ovd',         'tr.ovd',         'Ouderling van Dienst'],
            ['1eo',         'tr.eo1',         'Eerste Ontvangst'],
            ['beamer',      'tr.beamer',      'Beamer'],
            ['muziek',      'tr.muziek',      'Muziek'],
            ['voorzangers', 'tr.voorzangers', 'Voorzangers'],
            ['multimedia',  'tr.multimedia',  'Multimedia'],
            ['knd',         'tr.knd',         'KND'],
            ['tieners',     'tr.tieners',     'Tieners'],
            ['bijbellezers','tr.bijbellezers','Bijbellezers'],
        ];
        const lbl = (key, fb) => (typeof window.t === 'function' ? t(key) : fb);

        // Handle date selection
        function updateScheduleDetail() {
            const selected = dateData.find(d => d.value === scheduleDate.value);
            if (selected) {
                const dienstLabel = _dienstShort(selected.opmerking) || 'Eredienst';
                scheduleDetail.innerHTML = `
                    <div class="mb-1 text-xs font-semibold text-gkin-green">${dienstLabel}</div>
                    <div class="grid grid-cols-2 gap-x-2 gap-y-0.5 text-xs leading-tight">
                        ${FIELDS.map(([f, k, fb]) => `<div><strong>${lbl(k, fb)}:</strong> ${selected[f] || '-'}</div>`).join('')}
                    </div>
                `;
                scheduleDetail.classList.remove('hidden');
                document.getElementById('emptyState').classList.add('hidden');
            } else {
                scheduleDetail.classList.add('hidden');
                document.getElementById('emptyState').classList.remove('hidden');
            }
            resizeIframe(); // Resize after content change
        }

        scheduleDate.addEventListener('change', updateScheduleDetail);
        // Re-render labels when i18n.js applies/switches language
        document.addEventListener('gkin:langchange', updateScheduleDetail);

        // Select the first available schedule row so the embed always displays content.
        if (dateData.length > 0) {
            scheduleDate.value = dateData[0].value;
            updateScheduleDetail();
        }
    </script>
</body>
</html>
